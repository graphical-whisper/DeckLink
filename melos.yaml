name: tcg-exchange
description: TCG Exchange Platform - Flutter & Backend Monorepo

# Flutter version for the project
flutter:
  sdk: "3.24.0"

# Packages included in the monorepo
packages:
  - apps/frontend
  - libs/dto
  - libs/utils

# Scripts available via `melos run <script>`
scripts:
  # Flutter scripts
  analyze:
    description: "Analyze all Dart/Flutter packages"
    run: |
      melos exec -c 1 --flutter "flutter analyze"
  
  test:
    description: "Test all Dart/Flutter packages"
    run: |
      melos exec -c 1 --flutter "flutter test"
  
  format:
    description: "Format all Dart code"
    run: |
      melos exec -c 1 -- "dart format . --set-exit-if-changed"
  
  build:
    description: "Build all Flutter apps"
    run: |
      melos exec -c 1 --flutter "flutter build apk --release"
  
  pub_get:
    description: "Run pub get for all packages"
    run: |
      melos exec -c 1 --flutter "flutter pub get"
  
  # Cross-platform scripts
  generate:
    description: "Generate models from schemas"
    run: |
      ./infra/scripts/generate-models.sh
  
  # CI/CD scripts
  ci_validate:
    description: "Run all validations for CI"
    run: |
      melos run analyze
      melos run test
      ./infra/scripts/validate-proto.sh

# Environment variables
environment:
  MELOS_ROOT_PATH: "."

# Ignore patterns
ignore:
  - "**/build/"
  - "**/.dart_tool/"
  - "**/.packages"
  - "**/pubspec.lock"