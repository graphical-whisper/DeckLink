name: Develop Integration

on:
  pull_request:
    branches:
      - develop

jobs:
  integration:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies (Backend)
        run: cd apps/backend && npm install

      - name: Run All Tests (Backend)  
        run: cd apps/backend && npm test

      - name: Lint backend
        run: cd apps/backend && npm run lint  
      - name: Validate Schema Diff
        run: ./infra/scripts/check-schema-diff.sh

      - name: Regenerate SDKs
        run: ./infra/scripts/generate-models.sh

      - name: Verify SDKs are committed
        run: |
          if [[ -n "$(git status --porcelain libs/)" ]]; then
            echo "Library files changed but not committed!"
            exit 1
          fi

      - name: Build Flutter (Mobile)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.0"

      - name: Flutter pub get
        run: cd apps/frontend && flutter pub get

      - name: Flutter analyze
        run: cd apps/frontend && flutter analyze