name: Schema Guard

on:
  push:
    paths:
      - "libs/proto/*.proto"
      - "libs/models/**"

jobs:
  schema-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate Proto Files
        run: |
          if [ -d "libs/proto" ] && [ "$(ls -A libs/proto/*.proto 2>/dev/null)" ]; then
            protoc -I=libs/proto libs/proto/*.proto --dry_run
          else
            echo "No proto files found, skipping validation"
          fi

      - name: Enforce Field Number Rules
        run: ./infra/scripts/check-field-numbers.sh

      - name: Ensure Backward Compatibility
        run: ./infra/scripts/check-schema-backward-compat.sh